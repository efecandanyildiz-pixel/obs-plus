<!doctype html><html><head><meta charset="utf8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OBS+ — Yaşar Üniversitesi Öğrenci Bilgi Sistemi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#f4f6f9; --surface:#ffffff; --surface-2:#eef1f6;
    --ink:#14181f; --muted:#5c6673; --rule:#dde2ea;
    --primary:#2a3eb1; --primary-ink:#ffffff; --primary-soft:#e8eafc;
    --green:#16a34a; --green-soft:#e9f9ef;
    --amber:#b45309; --amber-soft:#fff3dd;
    --red:#dc2626; --red-soft:#fde9e9;
    --purple:#7c3aed; --purple-soft:#f1eafe;
    --f-display:"Space Grotesk",system-ui,sans-serif;
    --f-mono:"IBM Plex Mono",ui-monospace,monospace;
    --f-body:"IBM Plex Sans",system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.5;}
  a{color:var(--primary); text-decoration:none;}
  h1,h2,h3{font-family:var(--f-display); margin:0; line-height:1.15;}
  p{margin:0;}
  button{font-family:inherit; cursor:pointer;}
  table{border-collapse:collapse; width:100%;}
  ::selection{background:var(--primary); color:#fff;}

  .shell{display:grid; grid-template-columns:240px 1fr; min-height:100vh;}
  .sidebar{background:var(--ink); color:#cfd5e0; padding:16px 0; position:sticky; top:0; height:100vh; overflow-y:auto;}
  .sidebar .brand{display:flex; align-items:center; gap:10px; padding:4px 18px 18px; font-family:var(--f-display); font-weight:700; font-size:1.1rem; color:#fff;}
  .sidebar .brand .mark{width:28px; height:28px; background:var(--primary); border-radius:7px; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700;}
  .sidebar .grp{font-family:var(--f-mono); font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase; color:#7b8395; padding:14px 18px 6px;}
  .sidebar a.navitem{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 18px; font-size:13px; color:#cfd5e0; border-left:3px solid transparent;}
  .sidebar a.navitem:hover{background:#1e2330; color:#fff;}
  .sidebar a.navitem.active{background:#1e2330; color:#fff; border-left-color:var(--primary); font-weight:600;}
  .sidebar a.navitem .mini{font-family:var(--f-mono); font-size:9px; color:#5b6274; border:1px solid #333a4a; padding:1px 5px; border-radius:4px;}
  .sidebar a.navitem .mini.up{color:#8be38b; border-color:#2f5c37;}

  .main{min-width:0;}
  .topbar{background:var(--surface); border-bottom:1px solid var(--rule); position:sticky; top:0; z-index:40;}
  .topbar-inner{padding:13px 24px; display:flex; align-items:center; justify-content:space-between; gap:16px;}
  .topbar-title{font-family:var(--f-mono); font-size:12px; color:var(--muted);}
  .topbar-right{display:flex; align-items:center; gap:14px; font-family:var(--f-mono); font-size:12px; color:var(--muted);}
  .live-pill{display:inline-flex; align-items:center; gap:6px; background:var(--green-soft); color:var(--green); padding:5px 10px; border-radius:20px; font-weight:600;}
  .live-dot{width:6px; height:6px; border-radius:50%; background:var(--green); animation:pulse 1.6s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;} 50%{opacity:0.3;}}
  .profile-chip{display:flex; align-items:center; gap:8px; padding-left:14px; border-left:1px solid var(--rule);}
  .profile-chip .avatar{width:26px; height:26px; border-radius:50%; background:var(--primary-soft); color:var(--primary); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:11px;}
  .profile-chip .pinfo{display:flex; flex-direction:column; line-height:1.3;}
  .profile-chip .pname{color:var(--ink); font-weight:600; font-size:12px;}
  .profile-chip .pid{font-size:10.5px;}

  .content{padding:20px 24px 60px; max-width:1360px;}

  .kicker{font-family:var(--f-mono); font-size:11.5px; letter-spacing:0.07em; text-transform:uppercase; color:var(--primary); font-weight:600; margin-bottom:6px;}
  .pagehead{margin-bottom:18px;}
  .pagehead h1{font-size:1.6rem; margin-bottom:6px;}
  .pagehead p{color:var(--muted); font-size:0.94rem; max-width:62em;}
  .improved-badge{display:inline-flex; align-items:center; gap:5px; font-family:var(--f-mono); font-size:10.5px; font-weight:700; background:var(--green-soft); color:var(--green); padding:3px 9px; border-radius:20px; margin-left:10px; vertical-align:middle;}

  .card-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:22px;}
  .info-card{background:var(--surface); border:1px solid var(--rule); border-radius:12px; padding:14px 16px;}
  .info-card .lbl{font-family:var(--f-mono); font-size:10.5px; letter-spacing:0.04em; text-transform:uppercase; color:var(--muted); margin-bottom:6px;}
  .info-card .row{font-size:13px; margin-bottom:2px;}
  .info-card .row b{font-weight:600;}
  .tile-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px;}
  .tile{background:var(--surface); border:1px solid var(--rule); border-radius:12px; padding:16px; display:flex; align-items:center; gap:12px;}
  .tile:hover{border-color:var(--primary);}
  .tile .ic{width:36px; height:36px; border-radius:9px; background:var(--primary-soft); color:var(--primary); display:flex; align-items:center; justify-content:center; font-size:16px; flex:none;}
  .tile .tt{font-size:13px; font-weight:600;}
  .tile .ts{font-size:11px; color:var(--muted);}

  .feature-strip{display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin:18px 0 24px;}
  .feature-chip{background:var(--surface); border:1px solid var(--rule); border-radius:10px; padding:11px 13px; font-size:12px;}
  .feature-chip b{display:block; font-family:var(--f-display); font-size:0.88rem; margin-bottom:2px;}
  .feature-chip span{color:var(--muted); font-size:11.5px;}

  .banner{border-radius:10px; padding:11px 15px; font-size:13px; margin-bottom:18px; display:flex; gap:10px; align-items:flex-start;}
  .banner.amber{background:var(--amber-soft); color:var(--amber);}
  .banner.info{background:var(--primary-soft); color:var(--primary);}
  .banner b{font-weight:700;}

  .layout{display:grid; grid-template-columns:1fr 400px; gap:20px; align-items:start;}
  .toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px;}
  .tabbtn{font-family:var(--f-mono); font-size:12.5px; font-weight:600; padding:8px 14px; border-radius:20px; border:1px solid var(--rule); background:var(--surface); color:var(--muted);}
  .tabbtn.on{background:var(--primary); border-color:var(--primary); color:#fff;}
  .search{flex:1; min-width:180px; padding:9px 13px; border-radius:20px; border:1px solid var(--rule); background:var(--surface); font-family:var(--f-mono); font-size:12.5px;}
  .search:focus{outline:2px solid var(--primary); outline-offset:1px;}
  select.sortsel{padding:9px 13px; border-radius:20px; border:1px solid var(--rule); background:var(--surface); font-family:var(--f-mono); font-size:12px;}

  .course-list{display:flex; flex-direction:column; gap:12px;}
  .course-card{background:var(--surface); border:1px solid var(--rule); border-radius:14px; padding:18px;}
  .course-card.locked{opacity:0.72;}
  .course-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap;}
  .course-code{font-family:var(--f-mono); font-size:11.5px; color:var(--muted); font-weight:600;}
  .course-name{font-family:var(--f-display); font-size:1.08rem; font-weight:700; margin-top:1px;}
  .tag{display:inline-block; font-family:var(--f-mono); font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:5px; letter-spacing:0.02em; margin-left:8px; vertical-align:middle;}
  .tag.zorunlu{background:var(--primary-soft); color:var(--primary);}
  .tag.secmeli{background:var(--purple-soft); color:var(--purple);}
  .course-meta{font-family:var(--f-mono); font-size:11.5px; color:var(--muted); text-align:right;}

  .prereq-ok{margin-top:10px; font-size:12.5px; color:var(--green); display:flex; gap:6px; align-items:center;}
  .prereq-bad{margin-top:10px; background:var(--red-soft); color:var(--red); border-radius:8px; padding:9px 12px; font-size:12.5px; display:flex; gap:7px; align-items:flex-start;}
  .unlock-note{margin-top:8px; background:var(--green-soft); color:var(--green); border-radius:8px; padding:9px 12px; font-size:12.5px; display:flex; gap:7px; align-items:flex-start;}
  .lock-note{margin-top:8px; background:var(--amber-soft); color:var(--amber); border-radius:8px; padding:9px 12px; font-size:12.5px; display:flex; gap:7px; align-items:flex-start;}

  .sections{margin-top:12px; display:flex; flex-direction:column; gap:8px;}
  .section-row{border:1px solid var(--rule); border-radius:10px; padding:11px 13px; display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
  .section-row.selected{border-color:var(--primary); background:var(--primary-soft);}
  .section-row.full{background:var(--surface-2);}
  .section-info{flex:1; min-width:220px;}
  .section-instr{font-weight:600; font-size:13.5px;}
  .section-time{font-family:var(--f-mono); font-size:11.5px; color:var(--muted); margin-top:2px;}
  .avg-chip{font-family:var(--f-mono); font-size:11.5px; font-weight:700; border:1px solid var(--rule); background:var(--surface); padding:4px 9px; border-radius:7px; cursor:pointer;}
  .avg-chip:hover{border-color:var(--primary); color:var(--primary);}
  .seat-wrap{width:110px;}
  .seat-text{font-family:var(--f-mono); font-size:11px; color:var(--muted); display:flex; justify-content:space-between;}
  .seat-bar{height:5px; border-radius:4px; background:var(--surface-2); margin-top:4px; overflow:hidden;}
  .seat-fill{height:100%; background:var(--green); transition:width .3s;}
  .seat-fill.warn{background:var(--amber);}
  .seat-fill.full{background:var(--red);}
  .pick-btn{font-family:var(--f-mono); font-size:11.5px; font-weight:700; padding:8px 13px; border-radius:8px; border:1.5px solid var(--primary); background:var(--primary); color:#fff; white-space:nowrap;}
  .pick-btn.outline{background:transparent; color:var(--primary);}
  .pick-btn.wait{border-color:var(--amber); background:var(--amber); color:#fff;}
  .pick-btn.waited{border-color:var(--amber); background:var(--amber-soft); color:var(--amber);}
  .pick-btn.conflict{border-color:var(--red); background:var(--red); color:#fff; cursor:not-allowed;}
  .pick-btn:disabled{opacity:0.55; cursor:not-allowed;}

  .avg-pop{margin-top:10px; border-top:1px dashed var(--rule); padding-top:10px; font-size:12px; flex-basis:100%;}
  .avg-bars{display:flex; align-items:flex-end; gap:5px; height:60px; margin:8px 0;}
  .avg-bars div{flex:1; background:var(--primary); border-radius:3px 3px 0 0; position:relative;}
  .avg-bars span{position:absolute; top:-15px; left:0; right:0; text-align:center; font-family:var(--f-mono); font-size:9.5px; color:var(--muted);}
  .avg-labels{display:flex; gap:5px; font-family:var(--f-mono); font-size:9.5px; color:var(--muted); text-align:center;}
  .avg-labels div{flex:1;}
  .avg-stats{display:flex; gap:16px; margin-top:8px; font-family:var(--f-mono); font-size:11px; color:var(--muted); flex-wrap:wrap;}
  .avg-stats b{color:var(--ink);}

  .panel-sticky{position:sticky; top:72px; display:flex; flex-direction:column; gap:14px;}
  .panel{background:var(--surface); border:1px solid var(--rule); border-radius:14px; padding:16px;}
  .panel h3{font-size:0.95rem; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between;}
  .legend{display:flex; gap:10px; flex-wrap:wrap; font-family:var(--f-mono); font-size:10px; color:var(--muted); margin-top:8px;}
  .legend span{display:inline-flex; align-items:center; gap:4px;}
  .legend i{width:9px; height:9px; border-radius:2px; display:inline-block;}

  .grid-wrap{overflow-x:auto;}
  table.sched{border-collapse:collapse; width:100%; font-size:10.5px;}
  table.sched th{font-family:var(--f-mono); font-weight:600; color:var(--muted); font-size:10px; padding:4px 2px; border-bottom:1px solid var(--rule);}
  table.sched td{border:1px solid var(--rule); height:34px; width:60px; vertical-align:top; padding:1px;}
  table.sched td.hour{font-family:var(--f-mono); font-size:9.5px; color:var(--muted); border:0; text-align:right; padding-right:4px; width:34px;}
  .slot{height:100%; border-radius:4px; padding:2px 4px; font-size:9px; line-height:1.2; color:#fff; overflow:hidden;}
  .slot.zorunlu{background:var(--primary);}
  .slot.secmeli{background:var(--purple);}
  .slot.conflict{background:var(--red);}

  .summary-row{display:flex; justify-content:space-between; font-family:var(--f-mono); font-size:11.5px; padding:5px 0; border-bottom:1px dashed var(--rule);}
  .summary-row:last-child{border-bottom:0;}
  .akts-bar{height:7px; border-radius:4px; background:var(--surface-2); margin:8px 0 4px; overflow:hidden;}
  .akts-fill{height:100%; background:var(--primary);}

  .data-card{background:var(--surface); border:1px solid var(--rule); border-radius:12px; padding:18px; margin-bottom:16px;}
  .data-card h3{font-size:1rem; margin-bottom:2px;}
  .data-card .sub{font-family:var(--f-mono); font-size:11px; color:var(--muted); margin-bottom:12px;}
  table.datatable th{text-align:left; font-family:var(--f-mono); font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.03em; padding:7px 8px; border-bottom:1px solid var(--rule);}
  table.datatable td{padding:7px 8px; font-size:13px; border-bottom:1px solid var(--surface-2);}
  table.datatable tr:last-child td{border-bottom:0;}
  table.datatable td.fail{color:var(--red); font-weight:600;}
  table.datatable td.num{font-family:var(--f-mono); text-align:right;}
  .stat-pills{display:flex; gap:14px; flex-wrap:wrap; font-family:var(--f-mono); font-size:11.5px; color:var(--muted);}
  .stat-pills b{color:var(--ink); font-size:13px;}
  .badge-status{font-family:var(--f-mono); font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:20px;}
  .badge-status.ok{background:var(--green-soft); color:var(--green);}
  .badge-status.warn{background:var(--amber-soft); color:var(--amber);}
  .insight-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px;}
  .insight{flex:1; min-width:180px; background:var(--surface-2); border-radius:10px; padding:12px 14px;}
  .insight .lbl{font-family:var(--f-mono); font-size:10px; color:var(--muted); text-transform:uppercase; margin-bottom:4px;}
  .insight b{font-size:1.1rem; font-family:var(--f-display);}

  .gno-chart{display:flex; align-items:flex-end; gap:10px; height:140px; margin:18px 0 6px; padding:0 4px;}
  .gno-chart .bar{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%;}
  .gno-chart .fill{width:100%; background:var(--primary); border-radius:5px 5px 0 0; position:relative;}
  .gno-chart .fill.best{background:var(--green);}
  .gno-chart .fill.worst{background:var(--red);}
  .gno-chart .fill b{position:absolute; top:-18px; left:0; right:0; text-align:center; font-family:var(--f-mono); font-size:10.5px; color:var(--ink);}
  .gno-chart .lbl{margin-top:6px; font-family:var(--f-mono); font-size:9.5px; color:var(--muted); text-align:center;}

  .cal-table td, .cal-table th{padding:8px 10px; font-size:12.5px;}
  .cal-table th{text-align:left; font-family:var(--f-mono); font-size:10.5px; color:var(--muted); text-transform:uppercase; border-bottom:1px solid var(--rule);}
  .cal-table td{border-bottom:1px solid var(--surface-2);}
  .cal-table td.when{font-family:var(--f-mono); color:var(--muted); white-space:nowrap;}
  .cal-table tr.active-now{background:var(--green-soft);}
  .cal-table tr.soon{background:var(--amber-soft);}
  .countdown-chip{font-family:var(--f-mono); font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:20px; white-space:nowrap;}
  .countdown-chip.now{background:var(--green); color:#fff;}
  .countdown-chip.soon{background:var(--amber); color:#fff;}
  .countdown-chip.later{background:var(--surface-2); color:var(--muted);}
  .countdown-chip.past{background:var(--surface-2); color:var(--muted); opacity:0.6;}

  .placeholder-card{background:var(--surface); border:1px dashed var(--rule); border-radius:14px; padding:40px; text-align:center; color:var(--muted);}
  .placeholder-card .ic{font-size:2rem; margin-bottom:10px;}

  .exam-card{background:var(--surface); border:1px solid var(--rule); border-radius:12px; padding:16px; margin-bottom:10px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;}
  .exam-card.conflict{border-color:var(--red); background:var(--red-soft);}
  .exam-date{font-family:var(--f-display); font-weight:700; font-size:1.3rem; min-width:90px;}
  .exam-date span{display:block; font-family:var(--f-mono); font-size:10px; color:var(--muted); font-weight:400;}
  .exam-info{flex:1; min-width:200px;}
  .exam-info .nm{font-weight:600;}
  .exam-info .mt{font-family:var(--f-mono); font-size:11.5px; color:var(--muted); margin-top:2px;}

  .att-card{background:var(--surface); border:1px solid var(--rule); border-radius:12px; padding:16px; margin-bottom:10px;}
  .att-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; flex-wrap:wrap; gap:6px;}
  .att-bar{height:8px; border-radius:5px; background:var(--surface-2); overflow:hidden;}
  .att-fill{height:100%; background:var(--green);}
  .att-fill.warn{background:var(--amber);}
  .att-fill.danger{background:var(--red);}

  .toast-wrap{position:fixed; bottom:18px; right:18px; z-index:100; display:flex; flex-direction:column; gap:8px; max-width:320px;}
  .toast{background:var(--ink); color:#fff; padding:11px 14px; border-radius:10px; font-size:12.5px; box-shadow:0 8px 20px rgba(0,0,0,0.18); animation:slidein .25s ease;}
  .toast.good{background:var(--green);}
  .toast.warn{background:var(--amber);}
  @keyframes slidein{from{transform:translateX(30px); opacity:0;} to{transform:translateX(0); opacity:1;}}

  .req-tile{display:flex; align-items:center; gap:14px; background:var(--surface); border:1px solid var(--rule); border-radius:12px; padding:14px 16px; margin-bottom:10px;}
  .req-tile .ic{width:38px; height:38px; border-radius:10px; background:var(--primary-soft); color:var(--primary); display:flex; align-items:center; justify-content:center; font-size:16px; flex:none;}
  .req-tile .tt{font-weight:600; font-size:13.5px;}
  .req-tile .ts{font-size:12px; color:var(--muted); margin-top:1px;}
  .req-tile .st{margin-left:auto;}

  footer{text-align:center; padding:30px 0 10px; color:var(--muted); font-family:var(--f-mono); font-size:11px;}

  @media (max-width:1060px){
    .shell{grid-template-columns:1fr;}
    .sidebar{position:static; height:auto;}
    .layout{grid-template-columns:1fr;}
    .feature-strip{grid-template-columns:repeat(2,1fr);}
    .card-grid, .tile-grid{grid-template-columns:repeat(2,1fr);}
    .panel-sticky{position:static;}
  }
</style>
</head>
<body>

<div class="shell">
  <nav class="sidebar" id="sidebar"></nav>
  <div class="main">
    <div class="topbar"><div class="topbar-inner">
      <span class="topbar-title" id="topbarTitle">Öğrenci Bilgi Sistemi</span>
      <div class="topbar-right">
        <span class="live-pill"><span class="live-dot"></span>Canlı</span>
        <span id="clock"></span>
        <div class="profile-chip">
          <div class="avatar">E*</div>
          <div class="pinfo">
            <span class="pname">E***** D********</span>
            <span class="pid">Ö.No: 210••••••27 · T.C.: 453••••••16</span>
          </div>
        </div>
      </div>
    </div></div>
    <div class="content" id="content"></div>
    <footer>OBS+ — Bitirme ödevi prototipi · gerçek kayıt işlemi yapmaz, OBS'ten alınan gerçek (kimliği maskelenmiş) verilerle çalışır</footer>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script>
(function(){

  var TODAY = new Date(); // uses the real current date

  // =====================================================================
  // Shared student data (identity masked — real academic data from OBS)
  // =====================================================================
  var STU = {
    program:"Enerji Sistemleri Mühendisliği", fakulte:"Mühendislik Fakültesi",
    kayitTarihi:"28.01.2022", danisman:"Dr. Öğr. Üyesi Emrah Bıyık",
    agno:1.80, donem:9, normalSure:4, azamiSure:7,
    toplamAkts:184, hedefAkts:240,

  function toMin(t){ var p=t.split(":"); return (+p[0])*60+(+p[1]); }
  function prereqMet(course){ return course.prereq.every(function(p){ return completedCourses.indexOf(p)!==-1; }); }
  function conflictsWith(a,b){
    for(var i=0;i<a.length;i++) for(var j=0;j<b.length;j++)
      if(a[i].day===b[j].day && toMin(a[i].start)<toMin(b[j].end) && toMin(b[j].start)<toMin(a[i].end)) return true;
    return false;
  }
  function findConflict(section){
    for(var id in selected) if(conflictsWith(section.slots, selected[id].section.slots)) return selected[id];
    return null;
  }
  function seatColor(remaining, cap){ if(remaining<=0) return "full"; if(remaining/cap<0.15) return "warn"; return ""; }

  function courseMatches(c){
    if(curFilter!=="tumu" && c.type!==curFilter) return false;
    if(curSearch){ var q=curSearch.toLowerCase(); if(c.code.toLowerCase().indexOf(q)===-1 && c.name.toLowerCase().indexOf(q)===-1) return false; }
    return true;
  }

  function renderSection(course, s, prereqOk){
    var row = document.createElement("div");
    var remaining = s.cap - s.enrolled;
    var isSel = !!selected[s.id], isWaited = !!waitlisted[s.id];
    row.className = "section-row" + (isSel?" selected":"") + (remaining<=0 && !isSel?" full":"");
    var info = document.createElement("div"); info.className="section-info";
    var timeStr = s.slots.map(function(sl){ return sl.day+" "+sl.start+"-"+sl.end; }).join(" · ");
    info.innerHTML = '<div class="section-instr">'+s.instr+'</div><div class="section-time">'+timeStr+' · '+s.room+'</div>';
    row.appendChild(info);
    var avgBtn = document.createElement("button"); avgBtn.className="avg-chip";
    avgBtn.textContent = "Ort. " + s.hist[0].avg.toFixed(2) + " ▾";
    avgBtn.addEventListener("click", function(){
      var existing = row.querySelector(".avg-pop");
      if(existing){ existing.remove(); return; }
      row.appendChild(renderAvgPop(s));
    });
    row.appendChild(avgBtn);
    var seatWrap = document.createElement("div"); seatWrap.className="seat-wrap";
    var cls = seatColor(remaining, s.cap);
    seatWrap.innerHTML = '<div class="seat-text"><span>Kalan '+Math.max(remaining,0)+'</span><span>'+s.enrolled+'/'+s.cap+'</span></div>'+
      '<div class="seat-bar"><div class="seat-fill '+cls+'" style="width:'+Math.max(0,(remaining/s.cap*100))+'%"></div></div>';
    row.appendChild(seatWrap);
    var btn = document.createElement("button");
    if(!prereqOk){ btn.className="pick-btn outline"; btn.textContent="Kilitli"; btn.disabled=true; }
    else if(isSel){ btn.className="pick-btn outline"; btn.textContent="Çıkar"; btn.addEventListener("click", function(){ removeSection(s); }); }
    else if(isWaited){ btn.className="pick-btn waited"; btn.textContent="Listede bekliyor ✓";
      btn.addEventListener("click", function(){ delete waitlisted[s.id]; toast("Bekleme listesinden çıkarıldın: "+course.code,"warn"); renderAll(); }); }
    else {
      var conflict = findConflict(s);
      if(conflict){ btn.className="pick-btn conflict"; btn.textContent="Çakışıyor"; btn.title=conflict.course.code+" ile çakışıyor";
        btn.addEventListener("click", function(){ toast(course.code+" seçilemedi: "+conflict.course.code+" ile çakışıyor.","warn"); }); }
      else if(remaining<=0){ btn.className="pick-btn wait"; btn.textContent="Bekleme Listesi";
        btn.addEventListener("click", function(){ waitlisted[s.id]=true; toast("Bekleme listesine eklendin: "+course.code+" — yer açılınca otomatik kaydolursun."); renderAll(); }); }
      else { btn.className="pick-btn"; btn.textContent="Seç"; btn.addEventListener("click", function(){ addSection(course,s); }); }
    }
    row.appendChild(btn);
    return row;
  }

  function renderAvgPop(s){
    var h = s.hist[0]; var keys=["aa","ba","bb","cb","cc","dc","dd","ff"];
    var max = Math.max.apply(null, keys.map(function(k){ return h[k]||0; }));
    var pop = document.createElement("div"); pop.className="avg-pop";
    var barsHtml = '<div class="avg-bars">';
    keys.forEach(function(k){ var v=h[k]||0; var pct=max?(v/max*100):0; barsHtml += '<div style="height:'+pct+'%"><span>'+v+'</span></div>'; });
    barsHtml += '</div><div class="avg-labels">'+keys.map(function(k){return '<div>'+k.toUpperCase()+'</div>';}).join("")+'</div>';
    var histHtml = '<div class="avg-stats">'+s.hist.map(function(x){ return '<span>'+x.sem+': <b>'+x.avg.toFixed(2)+'</b></span>'; }).join("")+'</div>';
    pop.innerHTML = barsHtml + histHtml;
    return pop;
  }

  function addSection(course,s){
    var conflict = findConflict(s);
    if(conflict){ toast(course.code+" seçilemedi: çakışma var.","warn"); return; }
    selected[s.id] = {course:course, section:s}; s.enrolled++;
    toast(course.code+" ("+s.instr.split(" ").slice(-1)[0]+") programa eklendi.","good");
    renderAll();
  }
  function removeSection(s){
    var entry = selected[s.id]; if(!entry) return;
    delete selected[s.id]; s.enrolled = Math.max(0,s.enrolled-1);
    toast(entry.course.code+" programdan çıkarıldı."); renderAll();
  }

      var allSections = []; courses.forEach(function(c){ c.sections.forEach(function(s){ allSections.push(s); }); });
      var free = allSections.filter(function(s){ return !selected[s.id]; });
      if(!free.length) return;
      var s = free[Math.floor(Math.random()*free.length)];
      var remaining = s.cap - s.enrolled;
      if(remaining>0 && Math.random()<0.6) s.enrolled++;
      else if(remaining<=0 && waitlisted[s.id] && Math.random()<0.4){
        s.enrolled = Math.max(0,s.enrolled-1); delete waitlisted[s.id];
        var course = courses.find(function(c){ return c.sections.indexOf(s)!==-1; });
        selected[s.id] = {course:course, section:s}; s.enrolled++;
        toast("Yer açıldı! "+course.code+" bekleme listesinden otomatik kaydedildin.","good");

    var cards = attendance.map(function(a){
      if(a.muaf){
        return '<div class="att-card"><div class="att-top"><b>'+a.code+' — '+a.name+'</b><span class="badge-status ok">Devam zorunluluğu yok</span></div>'+
          '<div style="font-size:12px; color:var(--muted);">Bu derste yoklama alınmıyor.</div></div>';
      }
      var limit = Math.round(a.weekly*14*0.3); // typical 30% absence ceiling over a 14-week term
      var pct = Math.min(100, Math.round(a.used/limit*100));
      var cls = pct>=85?"danger":(pct>=60?"warn":"");
      return '<div class="att-card"><div class="att-top"><b>'+a.code+' — '+a.name+'</b><span>'+a.used+' / '+limit+' saat</span></div>'+
        '<div class="att-bar"><div class="att-fill '+cls+'" style="width:'+pct+'%"></div></div>'+
        '<div style="font-size:11.5px; color:var(--muted); margin-top:6px;">Haftalık ders yükü '+a.weekly+' saat · Henüz OBS\'te yoklama girişi yapılmadı, bu yüzden limit tavanın %30\'luk güvenli alanı gösteriliyor.</div></div>';
    }).join("");
    return '<div class="pagehead"><div class="kicker">'+STU.program+' · 2026-2027 Güz</div><h1>Devamsızlık Durumu'+improvedBadge()+'</h1>'+
      '<p>OBS sadece "Yoklama Girişi Yapılmamış" yazıp geçiyor; kaç saat hakkın kaldığını hiç göstermiyor. Burada riskli dersler renkle öne çıkıyor.</p></div>'+
      '<div class="data-card">'+cards+'</div>';
  }

  // =====================================================================
  // AKADEMİK TAKVİM — real dates + live countdown (upgraded)
  // =====================================================================
  var calendar = [
    ["Yeni Öğrenci Bilgi Toplama","01.01.2026","15.11.2026"],
    ["Yeni Öğrenci Ders Kayıt","15.09.2026","09.10.2026"],
    ["Yeni Öğrenci Danışman Onay","14.09.2026","09.10.2026"],
    ["Ders Kayıt","14.09.2026","09.10.2026"],
    ["Danışman Onay","14.09.2026","09.10.2026"],
    ["Yeni Öğrenci Ders Ekle/Bırak","21.09.2026","09.10.2026"],
    ["Yeni Öğrenci Ders Ekle/Bırak Onay","21.09.2026","09.10.2026"],
    ["Ders Ekle/Bırak","21.09.2026","09.10.2026"],
    ["Ders Ekle/Bırak Onay","21.09.2026","09.10.2026"],
    ["Ara Sınav Not Giriş","21.09.2026","13.01.2027"],
    ["Yarıyıl Sınavı Not Giriş","26.12.2026","13.01.2027"],
    ["Yarıyıl Sınavı Notlarının Öğrenciye Yayınlanması","13.01.2027",""],
    ["Harf Notlarının Öğrenciye Yayınlanması","13.01.2027",""],
    ["Öğretim Elemanı Bologna Giriş","09.09.2026","29.09.2026"],
    ["Danışman Not Giriş / Staj Not Giriş","21.09.2026","13.01.2027"]
  ];
  function renderAkademikTakvim(){
    var withMeta = calendar.map(function(c){
      var start = parseTR(c[1]), end = c[2]? parseTR(c[2]) : start;
      var startDiff = dayDiff(start), endDiff = dayDiff(end);
      var status, label;
      if(endDiff<0){ status="past"; label="Geçti"; }
      else if(startDiff<=0 && endDiff>=0){ status="now"; label=endDiff===0?"Son gün!":endDiff+" gün kaldı"; }
      else if(startDiff<=10){ status="soon"; label=startDiff+" gün sonra başlıyor"; }
      else { status="later"; label=startDiff+" gün sonra"; }
      return {c:c, status:status, label:label, startDiff:startDiff};
    });
    withMeta.sort(function(a,b){ return a.startDiff-b.startDiff; });
    var rows = withMeta.map(function(m){
      var rowCls = m.status==="now"?"active-now":(m.status==="soon"?"soon":"");
      return '<tr class="'+rowCls+'"><td>'+m.c[0]+'</td><td class="when">'+m.c[1]+'</td><td class="when">'+(m.c[2]||"—")+'</td>'+
        '<td><span class="countdown-chip '+m.status+'">'+m.label+'</span></td></tr>';
    }).join("");
    return '<div class="pagehead"><div class="kicker">2026-2027 Güz</div><h1>Akademik Takvim'+improvedBadge()+'</h1>'+
      '<p>OBS tarihleri düz bir liste olarak sıralar, hangisi yaklaşıyor hiç belli olmaz. Burada kalan gün sayısı otomatik hesaplanıyor ve yaklaşan tarihler öne alınıyor.</p></div>'+
      '<div class="data-card"><table class="cal-table"><tr><th>Takvim Adı</th><th>Başlangıç</th><th>Bitiş</th><th>Durum</th></tr>'+rows+'</table></div>';
  }

  // =====================================================================
  // DANIŞMAN — contact + approval status (upgraded)
  // =====================================================================
  function renderDanisman(){
    return '<div class="pagehead"><div class="kicker">'+STU.program+'</div><h1>Danışman Bilgileri'+improvedBadge()+'</h1>'+
      '<p>OBS sadece ismi gösterir; ulaşmanın bir yolu yok. Burada onay durumu ve randevu talebi var.</p></div>'+
      '<div class="data-card">'+
        '<h3>'+STU.danisman+'</h3>'+
        '<div class="sub">'+STU.fakulte+' — '+STU.program+'</div>'+
        '<table class="datatable">'+
          '<tr><td>Unvan</td><td>Dr. Öğretim Üyesi</td></tr>'+
          '<tr><td>Birim</td><td>'+STU.fakulte+'</td></tr>'+
          '<tr><td>Bölüm</td><td>'+STU.program+'</td></tr>'+
          '<tr><td>Danışmanlık Başlangıcı</td><td>'+STU.kayitTarihi+'</td></tr>'+
          '<tr><td>Bu Dönem Ders Kayıt Onayı</td><td><span class="badge-status ok">'+STU.danismanOnay+'</span></td></tr>'+
        '</table>'+
        '<button class="pick-btn" style="margin-top:14px;" id="randevuBtn">📅 Randevu Talep Et</button>'+
      '</div>';
  }

  // =====================================================================
  // BAŞVURU İŞLEMLERİ / BELGE TALEBİ — lightweight status tracker (upgraded)
  // =====================================================================
  function renderBasvuruIslemleri(){
    var items = [
      ["📝","Kayıt Dondurma Başvurusu","Sağlık/mali/kişisel nedenle dönem dondurma","Başlatılmadı"],
      ["🩺","Mazeret Sınavı Başvurusu","Girilemeyen sınav için mazeret talebi","Başlatılmadı"],
      ["📚","Ek Sınav Başvurusu","Azami süre sonunda ek sınav hakkı","Başlatılmadı"],
      ["🔁","Tek Ders Başvurusu","Mezuniyet için kalan tek ders sınavı","Başlatılmadı"],
      ["🎓","Bütünleşik Yüksek Lisans Başvurusu","Lisans-yüksek lisans birleşik program","Başlatılmadı"]
    ];
    var rows = items.map(function(it){ return '<div class="req-tile"><div class="ic">'+it[0]+'</div><div><div class="tt">'+it[1]+'</div><div class="ts">'+it[2]+'</div></div><div class="st"><span class="badge-status">'+it[3]+'</span></div></div>'; }).join("");
    return '<div class="pagehead"><div class="kicker">'+STU.program+'</div><h1>Başvuru İşlemleri'+improvedBadge()+'</h1>'+
      '<p>OBS bu başvuruları ayrı ayrı, açıklamasız formlar olarak listeler. Burada ne işe yaradığı ve durumu tek bakışta görünüyor.</p></div>'+rows;
  }
  function renderBelgeTalebi(){
    var items = [
      ["📄","Öğrenci Belgesi","Aktif öğrencilik durumunu gösteren resmi belge","Hazır değil"],
      ["📑","Transkript Çıktısı","Not dökümünün resmi onaylı çıktısı","Hazır değil"],
      ["🪪","Öğrenci Kimlik Kartı Talebi","Kayıp/yeni kart basımı","Hazır değil"]
    ];
    var rows = items.map(function(it){ return '<div class="req-tile"><div class="ic">'+it[0]+'</div><div><div class="tt">'+it[1]+'</div><div class="ts">'+it[2]+'</div></div><div class="st"><span class="badge-status">'+it[3]+'</span></div></div>'; }).join("");
    return '<div class="pagehead"><div class="kicker">'+STU.program+'</div><h1>Belge Talebi'+improvedBadge()+'</h1>'+
      '<p>Sık istenen belgeler tek listede, kısa açıklamalarıyla.</p></div>'+rows;
  }

  // =====================================================================
  // Generic OBS-identical placeholder (only used where nothing was changed)
  // =====================================================================
  function renderPlaceholder(label){
    return '<div class="pagehead"><div class="kicker">OBS\'teki ile aynı</div><h1>'+label+'</h1>'+
      '<p>Bu sayfada OBS+ kapsamında bir değişiklik yapılmadı — OBS\'teki hâliyle birebir aynı tutuldu.</p></div>'+
      '<div class="placeholder-card"><div class="ic">📄</div>Bu ekran OBS\'teki "'+label+'" sayfasıyla birebir aynıdır, OBS+ prototipi burada ek bir şey sunmuyor.</div>';
  }

  // =====================================================================
  // Clock
  // =====================================================================
  function tickClock(){ var el=document.getElementById("clock"); if(el) el.textContent = new Date().toLocaleTimeString("tr-TR"); }
  tickClock(); setInterval(tickClock, 1000);

  // =====================================================================
  // Router
  // =====================================================================
  function route(){
    var hash = location.hash.replace(/^#\/?/, "") || "anasayfa";
    stopDersKayitTimer();
    document.getElementById("topbarTitle").textContent = PAGE_TITLES[hash] || "Öğrenci Bilgi Sistemi";
    renderSidebar(hash);
    var content = document.getElementById("content");
    switch(hash){
      case "anasayfa": content.innerHTML = renderDashboard(); break;
      case "ders-kayit": content.innerHTML = renderDersKayitShell(false); initDersKayit(); break;
      case "ders-ekle-birak": content.innerHTML = renderDersKayitShell(true); initDersKayit(); break;
      case "ders-programi": content.innerHTML = renderDersProgrami(); break;
      case "transkript": content.innerHTML = renderTranskript(); break;
      case "not-listesi": content.innerHTML = renderNotListesi(); initNotListesi(); break;
      case "donem-ortalamalari": content.innerHTML = renderDonemOrtalamalari(); break;
      case "mufredat-durum": content.innerHTML = renderMufredatDurum(); break;
      case "sinav-takvimi": content.innerHTML = renderSinavTakvimi(); break;
      case "devamsizlik": content.innerHTML = renderDevamsizlik(); break;
      case "akademik-takvim": content.innerHTML = renderAkademikTakvim(); break;
      case "danisman":
        content.innerHTML = renderDanisman();
        setTimeout(function(){
          var b = document.getElementById("randevuBtn");
          if(b) b.addEventListener("click", function(){ toast("Randevu talebin "+STU.danisman+"'a iletildi.","good"); });
        }, 0);
        break;
      case "basvuru-islemleri": content.innerHTML = renderBasvuruIslemleri(); break;
      case "belge-talebi": content.innerHTML = renderBelgeTalebi(); break;
      default: content.innerHTML = renderPlaceholder(PAGE_TITLES[hash] || hash); break;
    }
    window.scrollTo(0,0);
  }
  window.addEventListener("hashchange", route);
  route();

})();
</script>

</body></html>
